<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rockville Town Center</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./public/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./public/vendor/three/build/three.module.js",
        "three/addons/": "./public/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <label id="graphics-settings">Graphics
    <select id="graphics-preset">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </label>
  <main id="viewport" aria-label="3D map of Rockville Town Center">
    <div id="loading" role="status" aria-live="polite">Starting 3D map…</div>
    <section id="start-panel" aria-labelledby="location" hidden>
      <div class="start-card">
        <h1 id="location">Rockville Town Center</h1>
        <p>East Montgomery Avenue · Helen Heneghan Way</p>
        <button id="start" type="button">Enter downtown</button>
        <p id="control-help"></p>
      </div>
    </section>
    <div id="hud" hidden>
      <div id="reticle" aria-hidden="true"></div>
      <p id="gait" hidden></p>
      <output id="weapon-hud" aria-label="Weapon and ammunition"></output>
      <output id="survival-hud" aria-label="Round, health and remaining zombies"></output>
      <p id="round-banner" role="status"></p>
      <output id="points-hud" aria-label="Available points"></output>
      <p id="machine-prompt" role="status"></p>
      <p id="machine-hint"></p>
      <div id="joystick" aria-label="Move"><span id="stick"></span></div>
      <div id="touch-actions">
        <button id="sprint" type="button" aria-pressed="false">Sprint</button>
        <button id="jump" type="button">Jump</button>
        <button id="aim" type="button" aria-pressed="false">Aim</button>
        <button id="fire" type="button">Fire</button>
        <button id="reload" type="button">Reload</button>
        <button id="swap" type="button">Swap</button>
        <button id="interact" type="button" hidden>Interact</button>
        <button id="shoulder" type="button">Shoulder</button>
      </div>
    </div>
    <section id="game-over" aria-labelledby="game-over-title" hidden>
      <div class="start-card">
        <h2 id="game-over-title">Game over</h2>
        <p id="game-over-summary"></p>
        <button id="restart-rounds" type="button">Restart</button>
      </div>
    </section>
  </main>
  <script type="module">
    import('./src/main.js').catch((error) => {
      document.querySelector('#loading').textContent =
        'Could not start the 3D map. Check the browser console for details.';
      console.error('Rockville startup failed:', error);
    });
  </script>
</body>
</html>
