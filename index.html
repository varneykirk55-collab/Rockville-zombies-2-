<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rockville Town Center</title>
  <link rel="stylesheet" href="./public/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="viewport" aria-label="3D map of Rockville Town Center">
    <div id="loading" role="status" aria-live="polite">Starting 3D map…</div>
    <section id="start-panel" aria-labelledby="location" hidden>
      <div class="start-card">
        <h1 id="location">Rockville Town Center</h1>
        <p>East Montgomery Avenue · Helen Heneghan Way</p>
        <button id="start" type="button">Enter downtown</button>
        <p id="control-help"></p>
      </div>
    </section>
    <div id="hud" hidden>
      <div id="reticle" aria-hidden="true"></div>
      <div id="joystick" aria-label="Move"><span id="stick"></span></div>
      <div id="touch-actions">
        <button id="sprint" type="button" aria-pressed="false">Sprint</button>
        <button id="aim" type="button" aria-pressed="false">Aim</button>
      </div>
    </div>
  </main>
  <script type="module">
    import('./src/main.js').catch((error) => {
      document.querySelector('#loading').textContent =
        'Could not start the 3D map. Check the browser console for details.';
      console.error('Rockville startup failed:', error);
    });
  </script>
</body>
</html>
